{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">{{ form.instance.pk|yesno:"Editar Hotel,Nuevo Hotel" }}</h2>
  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label for="id_name" class="form-label">Nombre</label>
      {{ form.name|add_class:"form-control" }}
    </div>

    <div class="mb-3">
      <label for="id_description" class="form-label">Descripción</label>
      {{ form.description|add_class:"form-control" }}
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'hotels:hotel_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
